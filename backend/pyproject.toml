[project]
name = "clario"
version = "0.1.0"
description = "Clario: private symptom diary with a clinic review server on AMD"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "openai>=1.50",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "pynacl>=1.5",
  "segno>=1.6",
  "python-multipart>=0.0.9",
  "pypdfium2>=4.30",
  "pillow>=10.4",
]

[project.optional-dependencies]
docs = ["fpdf2>=2.8"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: needs a running model endpoint (run with -m live)"]
addopts = "-m 'not live'"
