# Clinic server on one AMD Instinct MI300X droplet.
#   export HF_TOKEN=hf_... VLLM_API_KEY=$(openssl rand -hex 24) CLINIC_DOMAIN=clinic.example.com
#   docker compose -f deploy/docker-compose.clinic.yml up -d --build
# Optional fine-tuned adapter: see the LoRA note on the vllm command below.
# Only Caddy publishes ports (80/443). vLLM and Clario are on the internal network only.
# Uses the root Dockerfile (CLARIO_HOST=0.0.0.0, port 8800, data in /data); this file sets CLARIO_MODE=clinic.
# Clinic-only, single model. For the full demo (31B + E4B, patient app, GPU panel) use deploy/amd/docker-compose.yml.
services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai-rocm:v0.31.0}
    restart: unless-stopped
    ipc: host
    shm_size: 16gb
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN}
      VLLM_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY}
      HIP_FORCE_DEV_KERNARG: "1"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      # Adapter dir (needs adapter_config.json). Defaults to an empty placeholder when unused.
      - ${LORA_PATH:-./amd/.no-lora}:/lora/clario-extract:ro
    # LoRA is opt-in: set LORA_PATH (host adapter dir) AND
    # VLLM_LORA_ARGS="--enable-lora --lora-modules clario-extract=/lora/clario-extract --max-lora-rank 16"
    command: >
      --model ${LLM_MODEL:-google/gemma-4-31B-it}
      --served-model-name ${LLM_MODEL:-google/gemma-4-31B-it}
      --host 0.0.0.0 --port 8001
      --dtype bfloat16 --max-model-len ${MAX_MODEL_LEN:-16384} --max-num-seqs ${MAX_NUM_SEQS:-64}
      --gpu-memory-utilization 0.90 --enable-prefix-caching
      ${VLLM_LORA_ARGS:-}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 120
      start_period: 120s
    networks: [internal]

  clario:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      vllm:
        condition: service_healthy
    environment:
      CLARIO_MODE: clinic
      LLM_BASE_URL: http://vllm:8001/v1
      LLM_API_KEY: ${VLLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-google/gemma-4-31B-it}
      LLM_IS_AMD: "1"
    volumes:
      - clario-data:/data   # the root Dockerfile sets CLARIO_DATA_DIR=/data
    expose:
      - "8800"
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [clario]
    environment:
      CLINIC_DOMAIN: ${CLINIC_DOMAIN:?set CLINIC_DOMAIN}
    volumes:
      - ./amd/Caddyfile.compose:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    networks: [internal]

networks:
  internal:

volumes:
  clario-data:
  caddy-data:
  caddy-config:
