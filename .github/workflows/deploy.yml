# Deploy the public demo to Modal on every push to main, after the tests pass.
# Secrets: MODAL_TOKEN_ID, MODAL_TOKEN_SECRET (Settings > Secrets and variables > Actions).
# The model server is redeployed only when its own file changes; the landing page lives on the gh-pages branch.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests
        run: cd backend && uv run --all-extras pytest -q
      - name: Frontend tests and build
        run: cd frontend && npm ci --no-audit --no-fund && npx vitest run && npm run build
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal
      - name: Deploy patient app and clinic console
        run: PATIENT_LLM=modal modal deploy deploy/modal/apps.py
      - name: Deploy model server (only if it changed)
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^deploy/modal/serve_model.py$'; then
            modal deploy deploy/modal/serve_model.py
          else
            echo "serve_model.py unchanged, model server left as is"
          fi
      - name: Smoke check
        run: |
          for app in patient clinic; do
            curl -sf --retry 6 --retry-delay 20 --max-time 120 "https://se4wer--clario-$app.us-east.modal.run/api/health" > /dev/null
            echo "$app ok"
          done
